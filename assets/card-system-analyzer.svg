<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-labelledby="t d">
  <title id="t">System Analyzer</title>
  <desc id="d">System Analyzer: a native macOS monitoring and recovery workbench that explains system health instead of dumping raw metrics. macOS, Apple Silicon, performance.</desc>
  <defs>
    <radialGradient id="glow" cx="100%" cy="0%" r="80%">
      <stop offset="0" stop-color="#3DDC97" stop-opacity=".16"/>
      <stop offset="1" stop-color="#3DDC97" stop-opacity="0"/>
    </radialGradient>
    <style>
    .dot { animation: live 2.4s ease-in-out infinite; }
    @keyframes live { 50% { opacity: .3 } }
    .shine { animation: shine 2.2s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes shine { to { transform: translateX(200px) } }
    .arc { animation: arc 6s cubic-bezier(.65,0,.35,1) infinite; }
    @keyframes arc { 0%,100% { stroke-dasharray: 38 100 } 50% { stroke-dasharray: 72 100 } }
    .spark { stroke-dasharray: 100; animation: spark 4s cubic-bezier(.2,.8,.2,1) infinite; }
    @keyframes spark { 0% { stroke-dashoffset: 100 } 60%,100% { stroke-dashoffset: 0 } }
    .blip { animation: live 1.2s ease-in-out infinite; }
    .t { animation: tile 4.5s infinite; }
    .t1 { animation-delay: 0.0s; } .t2 { animation-delay: 0.5s; } .t3 { animation-delay: 1.0s; } .t4 { animation-delay: 1.5s; } .t5 { animation-delay: 2.0s; } .t6 { animation-delay: 2.5s; } .t7 { animation-delay: 3.0s; } .t8 { animation-delay: 3.5s; } .t9 { animation-delay: 4.0s; }
    @keyframes tile { 0%,14%,100% { fill: #141720; stroke: #252936 } 4%,8% { fill: #3DDC97; fill-opacity: .18; stroke: #3DDC97 } }
    .caret { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0 } }
    .route { animation: march 1.6s linear infinite; }
    @keyframes march { to { stroke-dashoffset: -22 } }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2s cubic-bezier(.2,.8,.2,1) infinite; }
    @keyframes pulse { 0% { transform: scale(.5); opacity: 1 } 100% { transform: scale(2); opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>
  <rect x=".5" y=".5" width="599" height="339" rx="22" fill="#0E1016"/>
  <rect x=".5" y=".5" width="599" height="339" rx="22" fill="url(#glow)" stroke="#20232D"/>

  <rect x="32" y="34" width="136" height="28" rx="14" fill="#3DDC97" fill-opacity=".12" stroke="#3DDC97" stroke-opacity=".35"/>
  <circle class="dot" cx="48" cy="48" r="4" fill="#3DDC97"/>
  <text x="60" y="53" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="13" fill="#3DDC97" letter-spacing="1.2">IN PROGRESS</text>

  <text x="32" y="122" font-family="Inter, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#F4F5F7" letter-spacing="-.5">System Analyzer</text>
  <text x="32" y="152" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="14" fill="#6B7184">Native macOS · Observability</text>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" font-size="18" fill="#AEB3C2">
    <text x="32" y="196">A calm, native workbench that explains</text>
    <text x="32" y="223">what your Mac is doing — not just stats.</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="14" fill="#C9CCD6">
    <rect x="32" y="268" width="66" height="32" rx="9" fill="#151821" stroke="#252936"/><text x="65.0" y="289" text-anchor="middle">macOS</text>
    <rect x="106" y="268" width="133" height="32" rx="9" fill="#151821" stroke="#252936"/><text x="172.5" y="289" text-anchor="middle">Apple Silicon</text>
    <rect x="247" y="268" width="58" height="32" rx="9" fill="#151821" stroke="#252936"/><text x="276.0" y="289" text-anchor="middle">Perf</text>
  </g>

  <circle cx="494" cy="104" r="54" fill="none" stroke="#1C202B" stroke-width="10"/>
  <circle class="arc" cx="494" cy="104" r="54" fill="none" stroke="#3DDC97" stroke-width="10" stroke-linecap="round" pathLength="100" stroke-dasharray="62 100" transform="rotate(-90 494 104)"/>
  <text x="494" y="100" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="12" fill="#6B7184" text-anchor="middle" letter-spacing="1">CPU</text>
  <text x="494" y="121" font-family="Inter, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#3DDC97" text-anchor="middle">calm</text>
  <rect x="426" y="182" width="140" height="62" rx="12" fill="#08090D" stroke="#20232D"/>
  <path class="spark" d="M436 228 L452 220 L466 224 L480 206 L494 214 L508 198 L522 210 L536 202 L556 208" fill="none" stroke="#3DDC97" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" pathLength="100"/>
  <circle class="blip" cx="556" cy="208" r="4" fill="#3DDC97"/>
</svg>
