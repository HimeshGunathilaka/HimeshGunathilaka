<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-labelledby="t d">
  <title id="t">Got a hard UI problem? Say hello.</title>
  <desc id="d">A call to action: got a hard UI problem? Let's make it feel effortless. A cursor clicks a "Say hello" button.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#1C202B"/>
    </pattern>
    <radialGradient id="glow" cx="85%" cy="50%" r="50%">
      <stop offset="0" stop-color="#0D99FF" stop-opacity=".2"/>
      <stop offset="1" stop-color="#0D99FF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1200" height="220" rx="28"/></clipPath>
    <style>
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .btn { transform-box: fill-box; transform-origin: center; animation: press 5s infinite; }
      @keyframes press {
        0%, 44%, 54%, 100% { transform: scale(1) }
        48% { transform: scale(.94) }
      }
      .cur { transform: translate(1010px, 124px); animation: move 5s infinite; animation-timing-function: cubic-bezier(.65,0,.35,1); }
      @keyframes move {
        0%, 8%    { transform: translate(790px, 150px) }
        40%, 60%  { transform: translate(1010px, 124px) }
        92%, 100% { transform: translate(790px, 150px) }
      }
      .ring { opacity: 0; transform-box: fill-box; transform-origin: center; animation: ring 5s infinite; }
      @keyframes ring {
        0%, 46% { opacity: 0; transform: scale(.3) }
        48%     { opacity: .9; transform: scale(.6) }
        58%     { opacity: 0; transform: scale(1.8) }
        100%    { opacity: 0 }
      }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="220" fill="#0A0B0F"/>
    <rect width="1200" height="220" fill="url(#dots)"/>
    <rect width="1200" height="220" fill="url(#glow)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="219" rx="28" fill="none" stroke="#1D212C"/>

  <text x="64" y="102" class="sans" font-size="46" font-weight="800" fill="#F4F5F7" letter-spacing="-1">Got a hard UI problem?</text>
  <text x="64" y="150" class="sans" font-size="25" fill="#9AA0B1">Let’s make it feel <tspan fill="#F4F5F7" font-weight="600">effortless</tspan>.</text>

  <g class="btn">
    <rect x="852" y="80" width="268" height="64" rx="16" fill="#0D99FF"/>
    <text x="986" y="121" class="sans" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">Say hello  →</text>
  </g>
  <circle class="ring" cx="1010" cy="124" r="20" fill="none" stroke="#FFFFFF" stroke-width="2"/>

  <g class="cur">
    <path d="M0 0 L0 22 L6 16.5 L10.5 26 L14 24.4 L9.6 15.2 L17 15.2 Z" fill="#A259FF" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="16" y="24" width="46" height="26" rx="7" fill="#A259FF"/>
    <text x="39" y="42" class="sans" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">you</text>
  </g>
</svg>
