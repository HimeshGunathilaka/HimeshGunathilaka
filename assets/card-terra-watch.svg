<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-labelledby="t d">
  <title id="t">Terra Watch</title>
  <desc id="d">Terra Watch: a trail-hazard reporting map with confidence-aware severity, helping people pick safer routes. Next.js, TypeScript, MapLibre GL JS, PostGIS, Drizzle.</desc>
  <defs>
    <radialGradient id="glow" cx="100%" cy="0%" r="80%">
      <stop offset="0" stop-color="#FF7A45" stop-opacity=".16"/>
      <stop offset="1" stop-color="#FF7A45" stop-opacity="0"/>
    </radialGradient>
    <style>
    .dot { animation: live 2.4s ease-in-out infinite; }
    @keyframes live { 50% { opacity: .3 } }
    .shine { animation: shine 2.2s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes shine { to { transform: translateX(200px) } }
    .arc { animation: arc 6s cubic-bezier(.65,0,.35,1) infinite; }
    @keyframes arc { 0%,100% { stroke-dasharray: 38 100 } 50% { stroke-dasharray: 72 100 } }
    .spark { stroke-dasharray: 100; animation: spark 4s cubic-bezier(.2,.8,.2,1) infinite; }
    @keyframes spark { 0% { stroke-dashoffset: 100 } 60%,100% { stroke-dashoffset: 0 } }
    .blip { animation: live 1.2s ease-in-out infinite; }
    .t { animation: tile 4.5s infinite; }
    .t1 { animation-delay: 0.0s; } .t2 { animation-delay: 0.5s; } .t3 { animation-delay: 1.0s; } .t4 { animation-delay: 1.5s; } .t5 { animation-delay: 2.0s; } .t6 { animation-delay: 2.5s; } .t7 { animation-delay: 3.0s; } .t8 { animation-delay: 3.5s; } .t9 { animation-delay: 4.0s; }
    @keyframes tile { 0%,14%,100% { fill: #141720; stroke: #252936 } 4%,8% { fill: #FF7A45; fill-opacity: .18; stroke: #FF7A45 } }
    .caret { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0 } }
    .route { animation: march 1.6s linear infinite; }
    @keyframes march { to { stroke-dashoffset: -22 } }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2s cubic-bezier(.2,.8,.2,1) infinite; }
    @keyframes pulse { 0% { transform: scale(.5); opacity: 1 } 100% { transform: scale(2); opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>
  <rect x=".5" y=".5" width="599" height="339" rx="22" fill="#0E1016"/>
  <rect x=".5" y=".5" width="599" height="339" rx="22" fill="url(#glow)" stroke="#20232D"/>

  <rect x="32" y="34" width="103" height="28" rx="14" fill="#FF7A45" fill-opacity=".12" stroke="#FF7A45" stroke-opacity=".35"/>
  <circle class="dot" cx="48" cy="48" r="4" fill="#FF7A45"/>
  <text x="60" y="53" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="13" fill="#FF7A45" letter-spacing="1.2">CONCEPT</text>

  <text x="32" y="122" font-family="Inter, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#F4F5F7" letter-spacing="-.5">Terra Watch</text>
  <text x="32" y="152" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="14" fill="#6B7184">Geospatial · Public safety</text>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" font-size="18" fill="#AEB3C2">
    <text x="32" y="196">A trail-hazard map that helps people</text>
    <text x="32" y="223">choose safer routes, with confidence.</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="14" fill="#C9CCD6">
    <rect x="32" y="268" width="83" height="32" rx="9" fill="#151821" stroke="#252936"/><text x="73.5" y="289" text-anchor="middle">Next.js</text>
    <rect x="123" y="268" width="91" height="32" rx="9" fill="#151821" stroke="#252936"/><text x="168.5" y="289" text-anchor="middle">MapLibre</text>
    <rect x="222" y="268" width="83" height="32" rx="9" fill="#151821" stroke="#252936"/><text x="263.5" y="289" text-anchor="middle">PostGIS</text>
  </g>

  <defs><clipPath id="map"><rect x="420" y="32" width="148" height="212" rx="14"/></clipPath></defs>
  <rect x="420" y="32" width="148" height="212" rx="14" fill="#08090D" stroke="#20232D"/>
  <g clip-path="url(#map)" fill="none" stroke="#1F2330" stroke-width="1.5">
    <path d="M470 60 C520 40 580 70 570 120 C562 170 500 180 470 150 C440 125 430 75 470 60 Z"/>
    <path d="M478 76 C515 62 556 84 550 118 C545 152 504 160 482 140 C460 122 452 88 478 76 Z"/>
    <path d="M486 92 C512 84 536 98 532 118 C528 138 504 142 492 130 C478 118 472 98 486 92 Z"/>
    <path d="M496 104 C510 100 520 108 518 118 C516 126 504 128 498 122 C490 116 488 108 496 104 Z"/>
    <path d="M400 200 C440 180 470 210 520 196 C560 186 590 210 600 230"/>
    <path d="M400 222 C440 204 476 232 524 218 C560 208 590 232 600 252"/>
  </g>
  <path class="route" clip-path="url(#map)" d="M432 236 C452 210 448 190 472 176 C498 162 470 140 508 122 C530 112 534 84 556 50" fill="none" stroke="#F4F5F7" stroke-opacity=".7" stroke-width="2" stroke-dasharray="5 6" stroke-linecap="round"/>
  <circle class="pulse" cx="522" cy="104" r="14" fill="none" stroke="#FF7A45" stroke-width="2"/>
  <circle cx="522" cy="104" r="6" fill="#FF7A45"/>
  <rect x="432" y="44" width="62" height="20" rx="6" fill="#FF7A45" fill-opacity=".14" stroke="#FF7A45" stroke-opacity=".5"/>
  <text x="463" y="58" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="11" fill="#FF7A45" text-anchor="middle">HIGH ▲</text>
</svg>
