<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-labelledby="t d">
  <title id="t">Scolaris GO</title>
  <desc id="d">Scolaris GO: a school management mobile app. Leading architecture, milestones, code reviews and app-store delivery. Offline support and security work. TypeScript, React Native, Expo.</desc>
  <defs>
    <radialGradient id="glow" cx="100%" cy="0%" r="80%">
      <stop offset="0" stop-color="#0D99FF" stop-opacity=".16"/>
      <stop offset="1" stop-color="#0D99FF" stop-opacity="0"/>
    </radialGradient>
    <style>
    .dot { animation: live 2.4s ease-in-out infinite; }
    @keyframes live { 50% { opacity: .3 } }
    .shine { animation: shine 2.2s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes shine { to { transform: translateX(200px) } }
    .arc { animation: arc 6s cubic-bezier(.65,0,.35,1) infinite; }
    @keyframes arc { 0%,100% { stroke-dasharray: 38 100 } 50% { stroke-dasharray: 72 100 } }
    .spark { stroke-dasharray: 100; animation: spark 4s cubic-bezier(.2,.8,.2,1) infinite; }
    @keyframes spark { 0% { stroke-dashoffset: 100 } 60%,100% { stroke-dashoffset: 0 } }
    .blip { animation: live 1.2s ease-in-out infinite; }
    .t { animation: tile 4.5s infinite; }
    .t1 { animation-delay: 0.0s; } .t2 { animation-delay: 0.5s; } .t3 { animation-delay: 1.0s; } .t4 { animation-delay: 1.5s; } .t5 { animation-delay: 2.0s; } .t6 { animation-delay: 2.5s; } .t7 { animation-delay: 3.0s; } .t8 { animation-delay: 3.5s; } .t9 { animation-delay: 4.0s; }
    @keyframes tile { 0%,14%,100% { fill: #141720; stroke: #252936 } 4%,8% { fill: #0D99FF; fill-opacity: .18; stroke: #0D99FF } }
    .caret { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0 } }
    .route { animation: march 1.6s linear infinite; }
    @keyframes march { to { stroke-dashoffset: -22 } }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2s cubic-bezier(.2,.8,.2,1) infinite; }
    @keyframes pulse { 0% { transform: scale(.5); opacity: 1 } 100% { transform: scale(2); opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>
  <rect x=".5" y=".5" width="599" height="339" rx="22" fill="#0E1016"/>
  <rect x=".5" y=".5" width="599" height="339" rx="22" fill="url(#glow)" stroke="#20232D"/>

  <rect x="32" y="34" width="112" height="28" rx="14" fill="#0D99FF" fill-opacity=".12" stroke="#0D99FF" stroke-opacity=".35"/>
  <circle class="dot" cx="48" cy="48" r="4" fill="#0D99FF"/>
  <text x="60" y="53" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="13" fill="#0D99FF" letter-spacing="1.2">SHIPPING</text>

  <text x="32" y="122" font-family="Inter, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#F4F5F7" letter-spacing="-.5">Scolaris GO</text>
  <text x="32" y="152" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="14" fill="#6B7184">School management · Mobile</text>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" font-size="18" fill="#AEB3C2">
    <text x="32" y="196">Leading architecture &amp; delivery of</text>
    <text x="32" y="223">a school app — offline-first, secure.</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="14" fill="#C9CCD6">
    <rect x="32" y="268" width="108" height="32" rx="9" fill="#151821" stroke="#252936"/><text x="86.0" y="289" text-anchor="middle">TypeScript</text>
    <rect x="148" y="268" width="125" height="32" rx="9" fill="#151821" stroke="#252936"/><text x="210.5" y="289" text-anchor="middle">React Native</text>
    <rect x="281" y="268" width="58" height="32" rx="9" fill="#151821" stroke="#252936"/><text x="310.0" y="289" text-anchor="middle">Expo</text>
  </g>

  <defs>
    <clipPath id="screen"><rect x="446" y="40" width="106" height="208" rx="15"/></clipPath>
    <linearGradient id="shine" x1="0" x2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".14"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="440" y="34" width="118" height="220" rx="20" fill="#08090D" stroke="#2A2E3A" stroke-width="2"/>
  <rect x="481" y="44" width="36" height="7" rx="3.5" fill="#1C202B"/>
  <g clip-path="url(#screen)">
    <rect x="456" y="62" width="86" height="16" rx="5" fill="#0D99FF"/>
    <g fill="#1C202B">
      <circle cx="466" cy="100" r="8"/><rect x="480" y="93" width="58" height="6" rx="3"/><rect x="480" y="104" width="38" height="5" rx="2.5"/>
      <circle cx="466" cy="132" r="8"/><rect x="480" y="125" width="52" height="6" rx="3"/><rect x="480" y="136" width="44" height="5" rx="2.5"/>
      <circle cx="466" cy="164" r="8"/><rect x="480" y="157" width="58" height="6" rx="3"/><rect x="480" y="168" width="30" height="5" rx="2.5"/>
      <circle cx="466" cy="196" r="8"/><rect x="480" y="189" width="46" height="6" rx="3"/><rect x="480" y="200" width="40" height="5" rx="2.5"/>
    </g>
    <rect class="shine" x="380" y="40" width="60" height="208" fill="url(#shine)"/>
  </g>
  <rect x="460" y="220" width="78" height="20" rx="10" fill="#0D99FF" fill-opacity=".14" stroke="#0D99FF" stroke-opacity=".5"/>
  <text x="499" y="234" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="11" fill="#0D99FF" text-anchor="middle">offline ✓</text>
</svg>
