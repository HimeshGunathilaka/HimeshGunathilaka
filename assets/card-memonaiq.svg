<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-labelledby="t d">
  <title id="t">MemonaIQ</title>
  <desc id="d">MemonaIQ: an independent SaaS of focused utilities for web workflows, digital infrastructure and security. Next.js, React, TypeScript, PostgreSQL, Prisma.</desc>
  <defs>
    <radialGradient id="glow" cx="100%" cy="0%" r="80%">
      <stop offset="0" stop-color="#A259FF" stop-opacity=".16"/>
      <stop offset="1" stop-color="#A259FF" stop-opacity="0"/>
    </radialGradient>
    <style>
    .dot { animation: live 2.4s ease-in-out infinite; }
    @keyframes live { 50% { opacity: .3 } }
    .shine { animation: shine 2.2s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes shine { to { transform: translateX(200px) } }
    .arc { animation: arc 6s cubic-bezier(.65,0,.35,1) infinite; }
    @keyframes arc { 0%,100% { stroke-dasharray: 38 100 } 50% { stroke-dasharray: 72 100 } }
    .spark { stroke-dasharray: 100; animation: spark 4s cubic-bezier(.2,.8,.2,1) infinite; }
    @keyframes spark { 0% { stroke-dashoffset: 100 } 60%,100% { stroke-dashoffset: 0 } }
    .blip { animation: live 1.2s ease-in-out infinite; }
    .t { animation: tile 4.5s infinite; }
    .t1 { animation-delay: 0.0s; } .t2 { animation-delay: 0.5s; } .t3 { animation-delay: 1.0s; } .t4 { animation-delay: 1.5s; } .t5 { animation-delay: 2.0s; } .t6 { animation-delay: 2.5s; } .t7 { animation-delay: 3.0s; } .t8 { animation-delay: 3.5s; } .t9 { animation-delay: 4.0s; }
    @keyframes tile { 0%,14%,100% { fill: #141720; stroke: #252936 } 4%,8% { fill: #A259FF; fill-opacity: .18; stroke: #A259FF } }
    .caret { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0 } }
    .route { animation: march 1.6s linear infinite; }
    @keyframes march { to { stroke-dashoffset: -22 } }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2s cubic-bezier(.2,.8,.2,1) infinite; }
    @keyframes pulse { 0% { transform: scale(.5); opacity: 1 } 100% { transform: scale(2); opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>
  <rect x=".5" y=".5" width="599" height="339" rx="22" fill="#0E1016"/>
  <rect x=".5" y=".5" width="599" height="339" rx="22" fill="url(#glow)" stroke="#20232D"/>

  <rect x="32" y="34" width="112" height="28" rx="14" fill="#A259FF" fill-opacity=".12" stroke="#A259FF" stroke-opacity=".35"/>
  <circle class="dot" cx="48" cy="48" r="4" fill="#A259FF"/>
  <text x="60" y="53" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="13" fill="#A259FF" letter-spacing="1.2">BUILDING</text>

  <text x="32" y="122" font-family="Inter, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#F4F5F7" letter-spacing="-.5">MemonaIQ</text>
  <text x="32" y="152" font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="14" fill="#6B7184">SaaS · Developer tools</text>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" font-size="18" fill="#AEB3C2">
    <text x="32" y="196">Small, sharp utilities for web, infra</text>
    <text x="32" y="223">&amp; security — each solving one thing.</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="14" fill="#C9CCD6">
    <rect x="32" y="268" width="83" height="32" rx="9" fill="#151821" stroke="#252936"/><text x="73.5" y="289" text-anchor="middle">Next.js</text>
    <rect x="123" y="268" width="108" height="32" rx="9" fill="#151821" stroke="#252936"/><text x="177.0" y="289" text-anchor="middle">PostgreSQL</text>
    <rect x="239" y="268" width="74" height="32" rx="9" fill="#151821" stroke="#252936"/><text x="276.0" y="289" text-anchor="middle">Prisma</text>
  </g>

  <g fill="#141720" stroke="#252936">
    <rect class="t t1" x="428" y="40" width="40" height="40" rx="10"/><rect class="t t2" x="478" y="40" width="40" height="40" rx="10"/><rect class="t t3" x="528" y="40" width="40" height="40" rx="10"/>
    <rect class="t t4" x="428" y="90" width="40" height="40" rx="10"/><rect class="t t5" x="478" y="90" width="40" height="40" rx="10"/><rect class="t t6" x="528" y="90" width="40" height="40" rx="10"/>
    <rect class="t t7" x="428" y="140" width="40" height="40" rx="10"/><rect class="t t8" x="478" y="140" width="40" height="40" rx="10"/><rect class="t t9" x="528" y="140" width="40" height="40" rx="10"/>
  </g>
